name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # re-sync the built root index.html for branch-source Pages
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify (typecheck · brand sync · API)
        run: |
          npm run typecheck
          npm run brand:check
          npm run test:api
      - run: npm run build
      - name: Sync built entry to repo root (legacy Pages branch mode)
        if: github.ref == 'refs/heads/main'
        run: |
          node scripts/sync-pages.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Screens entry + deep-link hand-off + crawler files (V12 routes).
          git add -f index.html favicon.svg 404.html robots.txt sitemap.xml 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Deploy: sync built entry for GitHub Pages [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
