name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # re-sync the built root index.html for branch-source Pages
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # R10: every action is pinned to a full commit SHA (tag in comment).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify (typecheck · brand sync · API · i18n)
        run: |
          npm run typecheck
          npm run brand:check
          npm run test:api
          npm run check:i18n
      - run: npm run build
      - name: Security gate (R1–R10)
        run: |
          test -f public/.well-known/security.txt
          grep -q '^Contact: mail:' public/.well-known/security.txt
          node -e "
            const fs = require('node:fs');
            const cfg = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
            const headers = (cfg.headers ?? []).flatMap((h) => h.headers);
            const csp = headers.find((h) => h.key === 'Content-Security-Policy-Report-Only');
            const enforcing = headers.find((h) => h.key === 'Content-Security-Policy');
            if (!csp) throw new Error('report-only CSP missing (R2)');
            if (enforcing) throw new Error('enforcing CSP found — CSP must stay REPORT-ONLY (R2)');
            for (const key of ['Strict-Transport-Security', 'X-Content-Type-Options', 'X-Frame-Options', 'Referrer-Policy', 'Permissions-Policy']) {
              if (!headers.some((h) => h.key === key)) throw new Error(key + ' missing (R3–R7)');
            }
          "
          grep -q 'upstash:' lib/quote-core.mjs
          node -e "
            const fs = require('node:fs');
            const wf = fs.readFileSync('.github/workflows/deploy.yml', 'utf8');
            const uses = [...wf.matchAll(/^\s*-\s*uses:\s*(\S+)/gm)].map((m) => m[1]);
            if (!uses.length) throw new Error('no actions found in deploy.yml');
            for (const u of uses) {
              if (!/^[a-z0-9]+\/[a-z0-9-_.]+@[0-9a-f]{40}$/.test(u)) throw new Error('action not SHA-pinned: ' + u);
            }
          "
          echo 'security gate passed'
      - name: Sync built entry to repo root (legacy Pages branch mode)
        if: github.ref == 'refs/heads/main'
        run: |
          node scripts/sync-pages.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Screens entry + deep-link hand-off + crawler files (V12 routes).
          git add -f index.html favicon.svg 404.html robots.txt sitemap.xml 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Deploy: sync built entry for GitHub Pages [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
